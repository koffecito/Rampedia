<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Rampage</title>
<meta name="description" content="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0f14;
  --card:#151822;
  --card-soft:#11141b;
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(216,162,74,0.32);
  --text:#eef0f4;
  --text-main:#d1d4dc;
  --text-dim:#9da2af;
  --accent:#d8a24a;
  --font-body:'Inter',sans-serif;
  --font-display:'Cinzel',serif;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(900px 600px at 50% -150px,#202431 0%,var(--bg) 65%);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}

.page{
  width:100%;
  max-width:780px;
  margin:0 auto;
  padding:25px 18px 60px;
}

.topbar{
  margin-bottom:22px;
}

.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--text-dim);
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  transition:color .2s ease;
}

.back-link:hover{
  color:var(--accent);
}

.back-icon{
  width:15px;
  height:15px;
  flex:0 0 15px;
  transition:transform .2s ease;
}

.back-link:hover .back-icon{
  transform:translateX(-2px);
}

.article{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
}

.cover{
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#101219;
}

.cover img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.article-content{
  padding:36px 40px 42px;
}

.article-label{
  margin:0 0 10px;
  color:var(--accent);
  font-family:var(--font-display);
  font-size:10px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
}

h1{
  margin:0;
  color:var(--text);
  font-family:var(--font-display);
  font-size:clamp(29px,6vw,42px);
  line-height:1.2;
}

.divider{
  width:45px;
  height:1px;
  margin:28px 0 32px;
  background:var(--accent);
  opacity:.75;
}

p{
  margin:0 0 18px;
  color:var(--text-main);
  font-size:14px;
  line-height:1.85;
}

h2{
  margin:40px 0 16px;
  color:var(--text);
  font-family:var(--font-display);
  font-size:22px;
  line-height:1.35;
}

h3{
  margin:30px 0 14px;
  color:var(--text);
  font-size:16px;
  font-weight:600;
  line-height:1.4;
}

strong{
  color:var(--text);
  font-weight:700;
}

em{
  font-style:italic;
}

.article-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin:18px 0 23px;
  padding:0;
  list-style:none;
}

.article-list li{
  display:flex;
  align-items:flex-start;
  gap:12px;
  color:var(--text-main);
  font-size:14px;
  line-height:1.6;
}

.article-list li::before{
  content:"";
  width:6px;
  height:6px;
  flex:0 0 6px;
  margin-top:8px;
  border:1px solid var(--accent);
  border-radius:2px;
  transform:rotate(45deg);
}

.quote{
  margin:23px 0;
  padding:17px 20px;
  background:var(--card-soft);
  border-left:2px solid var(--accent);
  border-radius:0 12px 12px 0;
}

.quote p{
  margin:0;
  color:var(--text-main);
  font-style:italic;
}

.screenshot{
  width:100%;
  margin:20px 0 28px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:12px;
  background:#101219;
}

.screenshot img{
  display:block;
  width:100%;
  height:auto;
}

.highlight{
  margin:25px 0;
  padding:18px 20px;
  background:linear-gradient(135deg,rgba(216,162,74,.12),transparent 65%),var(--card-soft);
  border:1px solid var(--border);
  border-left:2px solid var(--accent);
  border-radius:0 12px 12px 0;
}

.highlight p{
  margin:0;
}

.article-link{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px solid rgba(216,162,74,.35);
}

.telegram-section{
  margin-top:45px;
  padding-top:30px;
  border-top:1px solid var(--border);
}

.telegram-heading{
  margin:0 0 20px;
  font-family:var(--font-display);
  font-size:22px;
  line-height:1.35;
}

.telegram-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.telegram-button{
  position:relative;
  display:flex;
  align-items:center;
  min-height:68px;
  padding:9px 150px 9px 9px;
  background:var(--card-soft);
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  text-decoration:none;
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}

.telegram-button:hover{
  transform:translateY(-2px);
  border-color:var(--border-hover);
  background:#171b24;
}

.telegram-avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  margin-right:13px;
  border-radius:12px;
  object-fit:cover;
  background:#20242e;
}

.telegram-info{
  min-width:0;
}

.telegram-name{
  display:block;
  color:var(--text);
  font-size:13.5px;
  font-weight:600;
  line-height:1.35;
}

.telegram-name.community{
  max-width:125px;
}

.telegram-name.community span{
  display:block;
}

.telegram-badge{
  position:absolute;
  top:50%;
  right:43px;
  transform:translateY(-50%);
  padding:4px 8px;
  border:1px solid rgba(216,162,74,.28);
  border-radius:5px;
  background:rgba(216,162,74,.08);
  color:var(--accent);
  font-size:8px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  white-space:nowrap;
}

.telegram-arrow{
  position:absolute;
  top:50%;
  right:17px;
  width:8px;
  height:8px;
  border-top:1px solid var(--accent);
  border-right:1px solid var(--accent);
  transform:translateY(-50%) rotate(45deg);
  opacity:.75;
}

.author{
  margin-top:28px;
  text-align:center;
  color:#626773;
  font-size:11px;
}

.author-name{
  color:var(--accent);
  font-weight:600;
}

@media(max-width:520px){
  .page{
    padding:20px 12px 45px;
  }

  .article{
    border-radius:17px;
  }

  .article-content{
    padding:28px 20px 34px;
  }

  h1{
    font-size:28px;
  }

  h2{
    margin-top:34px;
    font-size:20px;
  }

  h3{
    font-size:15px;
  }

  p{
    font-size:13.5px;
    line-height:1.8;
  }

  .article-list li{
    font-size:13.5px;
  }

  .telegram-button{
    min-height:64px;
    padding:9px 125px 9px 9px;
  }

  .telegram-avatar{
    width:44px;
    height:44px;
    flex-basis:44px;
    margin-right:11px;
  }

  .telegram-name{
    font-size:13px;
  }

  .telegram-name.community{
    max-width:105px;
  }

  .telegram-badge{
    right:36px;
  }

  .telegram-arrow{
    right:15px;
  }
}
</style>
</head>

<body>

<main class="page">

<nav class="topbar">
<a class="back-link" href="../index.html">
<svg class="back-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<span data-i18n="back"></span>
</a>
</nav>

<article class="article">

<div class="cover">
<img src="../images/ban.jpg" alt="" id="coverImage">
</div>

<div class="article-content">

<p class="article-label" data-i18n="ban.label"></p>

<h1 data-i18n="ban.title"></h1>

<div id="article-body"></div>

<section class="telegram-section">

<h2 class="telegram-heading" data-i18n="telegram.title"></h2>

<div class="telegram-list">

<a class="telegram-button" href="https://t.me/AssanteGames" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/magic-rampage.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name">Magic Rampage</span>
</div>
<span class="telegram-badge" data-i18n="telegram.channel"></span>
<span class="telegram-arrow"></span>
</a>

<a class="telegram-button" href="https://t.me/AssanteGamesChat" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/magic-rampage-community.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name community">
<span>Magic Rampage</span>
<span>Community</span>
</span>
</div>
<span class="telegram-badge" data-i18n="telegram.group"></span>
<span class="telegram-arrow"></span>
</a>

<a class="telegram-button" href="https://t.me/MRCForum" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/mrc-forum.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name">MRC Forum</span>
</div>
<span class="telegram-badge" data-i18n="telegram.forum"></span>
<span class="telegram-arrow"></span>
</a>

</div>

</section>

</div>

</article>

<footer class="author">
<span data-i18n="made_by"></span>
<span class="author-name">Kofeman</span>
(@Koffecito)
</footer>

</main>

<script>
const DEFAULT_LANGUAGE="en";

function getLanguage(){
  const language=(navigator.language||"").toLowerCase();
  return language.startsWith("ru")?"ru":"en";
}

async function loadJson(path){
  const response=await fetch(path);
  if(!response.ok) throw new Error("File not found");
  return await response.json();
}

function getValue(object,path){
  return path.split(".").reduce((value,key)=>{
    return value && value[key]!==undefined ? value[key] : null;
  },object);
}

function applyCommon(data){
  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const value=getValue(data,element.dataset.i18n);
    if(value!==null) element.innerHTML=value;
  });
}

function resolveAsset(path){
  if(!path || /^(https?:|data:|\.\.\/)/i.test(path)) return path;
  if(path.startsWith("articles/")) return path.slice(9);
  if(path.startsWith("images/")) return `../${path}`;
  return path;
}

function renderSection(section){
  const fragment=document.createDocumentFragment();

  if(section.title){
    const heading=document.createElement("h2");
    heading.innerHTML=section.title;
    fragment.appendChild(heading);
  }

  if(section.subtitle){
    const heading=document.createElement("h3");
    heading.innerHTML=section.subtitle;
    fragment.appendChild(heading);
  }

  if(section.paragraphs){
    section.paragraphs.forEach(value=>{
      const paragraph=document.createElement("p");
      paragraph.innerHTML=value;
      fragment.appendChild(paragraph);
    });
  }

  if(section.quote){
    const block=document.createElement("div");
    block.className="quote";

    const paragraph=document.createElement("p");
    paragraph.innerHTML=section.quote;

    block.appendChild(paragraph);
    fragment.appendChild(block);
  }

  if(section.list){
    const list=document.createElement("ul");
    list.className="article-list";

    section.list.forEach(value=>{
      const item=document.createElement("li");
      item.innerHTML=value;
      list.appendChild(item);
    });

    fragment.appendChild(list);
  }

  if(section.image){
    const figure=document.createElement("div");
    figure.className="screenshot";

    const image=document.createElement("img");
    image.src=resolveAsset(section.image);
    image.alt=section.image_alt||"";
    image.loading="lazy";

    figure.appendChild(image);
    fragment.appendChild(figure);
  }

  if(section.highlight){
    const block=document.createElement("div");
    block.className="highlight";

    const paragraph=document.createElement("p");
    paragraph.innerHTML=section.highlight;

    block.appendChild(paragraph);
    fragment.appendChild(block);
  }

  return fragment;
}

async function init(){
  const language=getLanguage();

  let common;
  let article;

  try{
    common=await loadJson(`../lang/common/${language}.json`);
  }catch{
    common=await loadJson(`../lang/common/${DEFAULT_LANGUAGE}.json`);
  }

  try{
    article=await loadJson(`../lang/ban/${language}.json`);
  }catch{
    article=await loadJson(`../lang/ban/${DEFAULT_LANGUAGE}.json`);
  }

  applyCommon(common);

  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const key=element.dataset.i18n;

    if(key.startsWith("ban.")){
      const value=getValue(article,key);
      if(value!==null) element.innerHTML=value;
    }

    if(key.startsWith("telegram.")){
      const value=getValue(common,key);
      if(value!==null) element.innerHTML=value;
    }
  });

  document.title=getValue(article,"ban.title")||"Magic Rampage";

  const description=document.querySelector('meta[name="description"]');
  const descriptionValue=getValue(article,"ban.description");

  if(description && descriptionValue){
    description.content=descriptionValue;
  }

  const body=document.getElementById("article-body");

  article.ban.sections.forEach(section=>{
    body.appendChild(renderSection(section));
  });

  body.querySelectorAll("a[href^=\"articles/\"]").forEach(link=>{
    link.href=link.getAttribute("href").slice(9);
  });

  document.documentElement.lang=language;
}

init();
</script>

</body>
  </html>
