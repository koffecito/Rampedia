<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Rampage</title>
<meta name="description" content="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0f14;
  --card:#151822;
  --card-soft:#11141b;
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(216,162,74,0.32);
  --text:#eef0f4;
  --text-main:#d1d4dc;
  --text-dim:#9da2af;
  --accent:#d8a24a;
  --accent-soft:rgba(216,162,74,0.15);
  --font-body:'Inter',sans-serif;
  --font-display:'Cinzel',serif;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(900px 600px at 50% -150px,#202431 0%,var(--bg) 65%);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}

.page{
  width:100%;
  max-width:780px;
  margin:0 auto;
  padding:25px 18px 60px;
}

.topbar{
  margin-bottom:22px;
}

.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--text-dim);
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  transition:color .2s ease;
}

.back-link:hover{
  color:var(--accent);
}

.back-icon{
  width:15px;
  height:15px;
  flex:0 0 15px;
  transition:transform .2s ease;
}

.back-link:hover .back-icon{
  transform:translateX(-2px);
}

.article{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
}

.cover{
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#101219;
}

.cover img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.article-content{
  padding:36px 40px 42px;
}

.article-label{
  margin:0 0 10px;
  color:var(--accent);
  font-family:var(--font-display);
  font-size:10px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
}

h1{
  margin:0;
  color:var(--text);
  font-family:var(--font-display);
  font-size:clamp(29px,6vw,42px);
  line-height:1.2;
}

h2{
  margin:40px 0 16px;
  color:var(--text);
  font-family:var(--font-display);
  font-size:22px;
  line-height:1.35;
}

.achievement-section:first-child h2{
  margin-top:40px;
}

.achievement-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin:18px 0 0;
}

.achievement{
  display:grid;
  grid-template-columns:40px minmax(0,1fr);
  gap:13px;
  padding:13px 14px;
  background:var(--card-soft);
  border:1px solid var(--border);
  border-radius:12px;
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}

.achievement:hover{
  transform:translateY(-1px);
  border-color:var(--border-hover);
  background:#171b24;
}

.achievement-number{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin-top:1px;
  border:1px solid rgba(216,162,74,.28);
  border-radius:8px;
  color:var(--accent);
  font-size:10px;
  font-weight:700;
  line-height:1;
}

.achievement-content{
  min-width:0;
}

.achievement-title{
  margin:0 0 5px;
  color:var(--text);
  font-size:13.5px;
  font-weight:600;
  line-height:1.4;
}

.achievement-description{
  margin:0;
  color:var(--text-main);
  font-size:13px;
  line-height:1.7;
}

.telegram-section{
  margin-top:45px;
  padding-top:30px;
  border-top:1px solid var(--border);
}

.telegram-heading{
  margin:0 0 20px;
  font-family:var(--font-display);
  font-size:22px;
  line-height:1.35;
}

.telegram-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.telegram-button{
  position:relative;
  display:flex;
  align-items:center;
  min-height:68px;
  padding:9px 150px 9px 9px;
  background:var(--card-soft);
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  text-decoration:none;
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}

.telegram-button:hover{
  transform:translateY(-2px);
  border-color:var(--border-hover);
  background:#171b24;
}

.telegram-avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  margin-right:13px;
  border-radius:12px;
  object-fit:cover;
  background:#20242e;
}

.telegram-info{
  min-width:0;
}

.telegram-name{
  display:block;
  color:var(--text);
  font-size:13.5px;
  font-weight:600;
  line-height:1.35;
}

.telegram-name.community{
  max-width:125px;
}

.telegram-name.community span{
  display:block;
}

.telegram-badge{
  position:absolute;
  top:50%;
  right:43px;
  transform:translateY(-50%);
  padding:4px 8px;
  border:1px solid rgba(216,162,74,.28);
  border-radius:5px;
  background:rgba(216,162,74,.08);
  color:var(--accent);
  font-size:8px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  white-space:nowrap;
}

.telegram-arrow{
  position:absolute;
  top:50%;
  right:17px;
  width:8px;
  height:8px;
  border-top:1px solid var(--accent);
  border-right:1px solid var(--accent);
  transform:translateY(-50%) rotate(45deg);
  opacity:.75;
}

.author{
  margin-top:28px;
  text-align:center;
  color:#626773;
  font-size:11px;
}

.author-name{
  color:var(--accent);
  font-weight:600;
}

@media(max-width:520px){
  .page{
    padding:20px 12px 45px;
  }

  .article{
    border-radius:17px;
  }

  .article-content{
    padding:28px 20px 34px;
  }

  h1{
    font-size:28px;
  }

  h2{
    margin-top:34px;
    font-size:20px;
  }

  .achievement{
    grid-template-columns:34px minmax(0,1fr);
    gap:11px;
    padding:12px;
  }

  .achievement-number{
    width:30px;
    height:30px;
  }

  .achievement-title{
    font-size:13px;
  }

  .achievement-description{
    font-size:12.5px;
    line-height:1.7;
  }

  .telegram-button{
    min-height:64px;
    padding:9px 125px 9px 9px;
  }

  .telegram-avatar{
    width:44px;
    height:44px;
    flex-basis:44px;
    margin-right:11px;
  }

  .telegram-name{
    font-size:13px;
  }

  .telegram-name.community{
    max-width:105px;
  }

  .telegram-badge{
    right:36px;
  }

  .telegram-arrow{
    right:15px;
  }
}
</style>
</head>

<body>

<main class="page">

<nav class="topbar">
<a class="back-link" href="../index.html">
<svg class="back-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<span data-i18n="back"></span>
</a>
</nav>

<article class="article">

<div class="cover">
<img src="../images/achievements.jpg" alt="" id="coverImage">
</div>

<div class="article-content">

<p class="article-label" data-i18n="achievements.label"></p>

<h1 data-i18n="achievements.title"></h1>

<div id="article-body"></div>

<section class="telegram-section">

<h2 class="telegram-heading" data-i18n="telegram.title"></h2>

<div class="telegram-list">

<a class="telegram-button" href="https://t.me/AssanteGames" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/magic-rampage.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name">Magic Rampage</span>
</div>
<span class="telegram-badge" data-i18n="telegram.channel"></span>
<span class="telegram-arrow"></span>
</a>

<a class="telegram-button" href="https://t.me/AssanteGamesChat" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/magic-rampage-community.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name community">
<span>Magic Rampage</span>
<span>Community</span>
</span>
</div>
<span class="telegram-badge" data-i18n="telegram.group"></span>
<span class="telegram-arrow"></span>
</a>

<a class="telegram-button" href="https://t.me/MRCForum" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/mrc-forum.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name">MRC Forum</span>
</div>
<span class="telegram-badge" data-i18n="telegram.forum"></span>
<span class="telegram-arrow"></span>
</a>

</div>

</section>

</div>

</article>

<footer class="author">
<span data-i18n="made_by"></span>
<span class="author-name">Kofeman</span>
(@Koffecito)
</footer>

</main>

<script>
const DEFAULT_LANGUAGE="en";

function getLanguage(){
  const language=(navigator.language||"").toLowerCase();
  return language.startsWith("ru")?"ru":"en";
}

async function loadJson(path){
  const response=await fetch(path);
  if(!response.ok) throw new Error("File not found");
  return await response.json();
}

function getValue(object,path){
  return path.split(".").reduce((value,key)=>{
    return value && value[key]!==undefined ? value[key] : null;
  },object);
}

function applyCommon(data){
  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const value=getValue(data,element.dataset.i18n);
    if(value!==null) element.innerHTML=value;
  });
}

function renderAchievement(item){
  const article=document.createElement("article");
  article.className="achievement";

  const number=document.createElement("div");
  number.className="achievement-number";
  number.textContent=item.number;

  const content=document.createElement("div");
  content.className="achievement-content";

  const title=document.createElement("h3");
  title.className="achievement-title";
  title.textContent=item.title;

  const description=document.createElement("p");
  description.className="achievement-description";
  description.textContent=item.description;

  content.appendChild(title);
  content.appendChild(description);

  article.appendChild(number);
  article.appendChild(content);

  return article;
}

function resolveAsset(path){
  if(!path || /^(https?:|data:|\.\.\/)/i.test(path)) return path;
  if(path.startsWith("articles/")) return path.slice(9);
  if(path.startsWith("images/")) return `../${path}`;
  return path;
}

function renderSection(section){
  const wrapper=document.createElement("section");
  wrapper.className="achievement-section";

  if(section.title){
    const heading=document.createElement("h2");
    heading.innerHTML=section.title;
    wrapper.appendChild(heading);
  }

  if(section.items){
    const list=document.createElement("div");
    list.className="achievement-list";

    section.items.forEach(item=>{
      list.appendChild(renderAchievement(item));
    });

    wrapper.appendChild(list);
  }

  return wrapper;
}

async function init(){
  const language=getLanguage();

  let common;
  let article;

  try{
    common=await loadJson(`../lang/common/${language}.json`);
  }catch{
    common=await loadJson(`../lang/common/${DEFAULT_LANGUAGE}.json`);
  }

  try{
    article=await loadJson(`../lang/achievements/${language}.json`);
  }catch{
    article=await loadJson(`../lang/achievements/${DEFAULT_LANGUAGE}.json`);
  }

  applyCommon(common);

  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const key=element.dataset.i18n;

    if(key.startsWith("achievements.")){
      const value=getValue(article,key);

      if(value!==null){
        element.innerHTML=value;
      }
    }

    if(key.startsWith("telegram.")){
      const value=getValue(common,key);

      if(value!==null){
        element.innerHTML=value;
      }
    }
  });

  document.title=getValue(article,"achievements.title")||"Magic Rampage";

  const description=document.querySelector('meta[name="description"]');
  const descriptionValue=getValue(article,"achievements.description");

  if(description && descriptionValue){
    description.content=descriptionValue;
  }

  const coverAlt=getValue(article,"achievements.cover_alt");

  if(coverAlt){
    document.getElementById("coverImage").alt=coverAlt;
  }

  const body=document.getElementById("article-body");

  article.achievements.sections.forEach(section=>{
    body.appendChild(renderSection(section));
  });

  document.documentElement.lang=language;
}

init();
</script>

</body>
</html>
