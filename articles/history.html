<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Rampage</title>
<meta name="description" content="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0f14;
  --card:#151822;
  --card-soft:#11141b;
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(216,162,74,0.32);
  --text:#eef0f4;
  --text-main:#d1d4dc;
  --text-dim:#9da2af;
  --accent:#d8a24a;
  --font-body:'Inter',sans-serif;
  --font-display:'Cinzel',serif;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(900px 600px at 50% -150px,#202431 0%,var(--bg) 65%);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}

.page{
  width:100%;
  max-width:780px;
  margin:0 auto;
  padding:25px 18px 60px;
}

.language-switcher{
  position: absolute;
  top:18px;
  right:18px;
  z-index:20;
}

.language-button{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:58px;
  justify-content:center;
  padding:5px 7px;
  border:1px solid var(--border);
  border-radius:11px;
  background:rgba(21,24,34,.92);
  color:var(--text);
  font-family:var(--font-body);
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:border-color .2s ease,background .2s ease;
}

.language-button:hover{
  border-color:var(--border-hover);
  background:rgba(28,31,42,.96);
}

.language-flag{
  font-size:13px;
  line-height:1;
}

.language-chevron{
  width:6px;
  height:6px;
  border-right:1px solid var(--text-dim);
  border-bottom:1px solid var(--text-dim);
  transform:rotate(45deg) translateY(-2px);
  transition:transform .2s ease;
}

.language-switcher.open .language-chevron{
  transform:rotate(225deg) translate(-1px,-1px);
}

.language-menu{
  position:absolute;
  top:calc(100% + 7px);
  right:0;
  display:none;
  min-width:100%;
  padding:5px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(21,24,34,.98);
  box-shadow:0 12px 30px rgba(0,0,0,.28);
  backdrop-filter:blur(10px);
}

.language-switcher.open .language-menu{
  display:block;
}

.language-option{
  width:100%;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 8px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--text);
  font-family:var(--font-body);
  font-size:12px;
  text-align:left;
  cursor:pointer;
}

.language-option:hover,
.language-option.active{
  background:rgba(216,162,74,.1);
  color:var(--accent);
}

.topbar{
  margin-bottom:22px;
}

.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--text-dim);
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  transition:color .2s ease;
}

.back-link:hover{
  color:var(--accent);
}

.back-icon{
  width:15px;
  height:15px;
  flex:0 0 15px;
  transition:transform .2s ease;
}

.back-link:hover .back-icon{
  transform:translateX(-2px);
}

.article{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
}

.cover{
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#101219;
}

.cover img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.article-content{
  padding:36px 40px 42px;
}

.article-label{
  margin:0 0 10px;
  color:var(--accent);
  font-family:var(--font-display);
  font-size:10px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
}

h1{
  margin:0;
  color:var(--text);
  font-family:var(--font-display);
  font-size:clamp(29px,6vw,42px);
  line-height:1.2;
}

p{
  margin:0 0 18px;
  color:var(--text-main);
  font-size:14px;
  line-height:1.85;
}

h2{
  margin:40px 0 16px;
  color:var(--text);
  font-family:var(--font-display);
  font-size:22px;
  line-height:1.35;
}

strong{
  color:var(--text);
  font-weight:700;
}

em{
  font-style:italic;
}

.fact{
  margin:22px 0 25px;
  padding:16px 19px;
  background:linear-gradient(135deg,rgba(216,162,74,.12),transparent 65%),var(--card-soft);
  border:1px solid var(--border);
  border-left:2px solid var(--accent);
  border-radius:0 12px 12px 0;
}

.fact p{
  margin:0;
  color:var(--text-main);
  font-size:13.5px;
  line-height:1.75;
}

.fact-label{
  color:var(--accent);
  font-weight:700;
}

.article-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin:18px 0 23px;
  padding:0;
  list-style:none;
}

.article-list li{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--text-main);
  font-size:14px;
  line-height:1.6;
}

.article-list li::before{
  content:"";
  display:block;
  width:6px;
  height:6px;
  flex:0 0 6px;
  border:1px solid var(--accent);
  border-radius:2px;
  transform:rotate(45deg);
}

.telegram-section{
  margin-top:45px;
  padding-top:30px;
  border-top:1px solid var(--border);
}

.telegram-heading{
  margin:0 0 20px;
  font-family:var(--font-display);
  font-size:22px;
  line-height:1.35;
}

.telegram-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.telegram-button{
  position:relative;
  display:flex;
  align-items:center;
  min-height:68px;
  padding:9px 150px 9px 9px;
  background:var(--card-soft);
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  text-decoration:none;
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}

.telegram-button:hover{
  transform:translateY(-2px);
  border-color:var(--border-hover);
  background:#171b24;
}

.telegram-avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  margin-right:13px;
  border-radius:12px;
  object-fit:cover;
  background:#20242e;
}

.telegram-info{
  min-width:0;
}

.telegram-name{
  display:block;
  color:var(--text);
  font-size:13.5px;
  font-weight:600;
  line-height:1.35;
}

.telegram-name.community{
  max-width:125px;
}

.telegram-name.community span{
  display:block;
}

.telegram-badge{
  position:absolute;
  top:50%;
  right:43px;
  transform:translateY(-50%);
  padding:4px 8px;
  border:1px solid rgba(216,162,74,.28);
  border-radius:5px;
  background:rgba(216,162,74,.08);
  color:var(--accent);
  font-size:8px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  white-space:nowrap;
}

.telegram-arrow{
  position:absolute;
  top:50%;
  right:17px;
  width:8px;
  height:8px;
  border-top:1px solid var(--accent);
  border-right:1px solid var(--accent);
  transform:translateY(-50%) rotate(45deg);
  opacity:.75;
}

.author{
  margin-top:28px;
  text-align:center;
  color:#626773;
  font-size:11px;
}

.author-name{
  color:var(--accent);
  font-weight:600;
}

@media(max-width:520px){
  .language-switcher{
    top:12px;
    right:12px;
  }

  .language-button{
    min-width:68px;
    padding:7px 9px;
  }

  .page{
    padding:20px 12px 45px;
  }

  .article{
    border-radius:17px;
  }

  .article-content{
    padding:28px 20px 34px;
  }

  h1{
    font-size:28px;
  }

  h2{
    margin-top:34px;
    font-size:20px;
  }

  p{
    font-size:13.5px;
    line-height:1.8;
  }

  .article-list li{
    font-size:13.5px;
  }

  .telegram-button{
    min-height:64px;
    padding:9px 125px 9px 9px;
  }

  .telegram-avatar{
    width:44px;
    height:44px;
    flex-basis:44px;
    margin-right:11px;
  }

  .telegram-name{
    font-size:13px;
  }

  .telegram-name.community{
    max-width:105px;
  }

  .telegram-badge{
    right:36px;
  }

  .telegram-arrow{
    right:15px;
  }
}
</style>
</head>

<body>

<div class="language-switcher" id="language-switcher">
  <button class="language-button" id="language-button" type="button" aria-expanded="false" aria-haspopup="true">
    <span class="language-flag" id="language-flag">🇬🇧</span>
    <span id="language-code">EN</span>
    <span class="language-chevron"></span>
  </button>
  <div class="language-menu" id="language-menu">
    <button class="language-option" type="button" data-language="ru"><span>🇷🇺</span><span>RU</span></button>
    <button class="language-option" type="button" data-language="en"><span>🇬🇧</span><span>EN</span></button>
  </div>
</div>


<main class="page">

<nav class="topbar">
<a class="back-link" href="../index.html">
<svg class="back-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<span data-i18n="back"></span>
</a>
</nav>

<article class="article">

<div class="cover">
<img src="../images/history.jpg" alt="" id="coverImage">
</div>

<div class="article-content">

<p class="article-label" data-i18n="history.label"></p>

<h1 data-i18n="history.title"></h1>

<div id="article-body"></div>

<section class="telegram-section">

<h2 class="telegram-heading" data-i18n="telegram.title"></h2>

<div class="telegram-list">

<a class="telegram-button" href="https://t.me/AssanteGames" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/magic-rampage.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name">Magic Rampage</span>
</div>
<span class="telegram-badge" data-i18n="telegram.channel"></span>
<span class="telegram-arrow"></span>
</a>

<a class="telegram-button" href="https://t.me/AssanteGamesChat" target="_blank" rel="noopener noreferrer">
<img class="telegram-avatar" src="../images/telegram/magic-rampage-community.jpg" alt="">
<div class="telegram-info">
<span class="telegram-name community">
<span>Magic Rampage</span>
<span>Community</span>
</span>
</div>
<span class="telegram-badge" data-i18n="telegram.group"></span>
<span class="telegram-arrow"></span>
</a>



</div>

</section>

</div>

</article>

<footer class="author">
<span data-i18n="made_by"></span>
<span class="author-name">Kofeman</span>
(@Koffecito)
</footer>

</main>

<script>
const DEFAULT_LANGUAGE="en";


const languageSwitcher=document.getElementById("language-switcher");
const languageButton=document.getElementById("language-button");
const languageFlag=document.getElementById("language-flag");
const languageCode=document.getElementById("language-code");

function getLanguage(){
  const saved=localStorage.getItem("rampedia-language");
  if(saved==="ru" || saved==="en") return saved;
  const browserLanguage=(navigator.language||"").toLowerCase();
  return browserLanguage.startsWith("ru")?"ru":"en";
}

function updateLanguageButton(){
  const language=getLanguage();
  languageFlag.textContent=language==="ru"?"🇷🇺":"🇬🇧";
  languageCode.textContent=language.toUpperCase();
  document.querySelectorAll(".language-option").forEach(option=>{
    option.classList.toggle("active",option.dataset.language===language);
  });
}

languageButton.addEventListener("click",event=>{
  event.stopPropagation();
  const open=languageSwitcher.classList.toggle("open");
  languageButton.setAttribute("aria-expanded",open?"true":"false");
});

document.querySelectorAll(".language-option").forEach(option=>{
  option.addEventListener("click",()=>{
    localStorage.setItem("rampedia-language",option.dataset.language);
    location.reload();
  });
});

document.addEventListener("click",()=>{
  languageSwitcher.classList.remove("open");
  languageButton.setAttribute("aria-expanded","false");
});

updateLanguageButton();


async function loadJson(path){
  const response=await fetch(path);
  if(!response.ok) throw new Error("File not found");
  return await response.json();
}

function getValue(object,path){
  return path.split(".").reduce((value,key)=>{
    return value && value[key]!==undefined ? value[key] : null;
  },object);
}

function applyCommon(data){
  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const value=getValue(data,element.dataset.i18n);
    if(value!==null) element.innerHTML=value;
  });
}

function renderSection(section,common){
  const fragment=document.createDocumentFragment();

  if(section.title){
    const heading=document.createElement("h2");
    heading.innerHTML=section.title;
    fragment.appendChild(heading);
  }

  if(section.paragraphs){
    section.paragraphs.forEach(value=>{
      const paragraph=document.createElement("p");
      paragraph.innerHTML=value;
      fragment.appendChild(paragraph);
    });
  }

  if(section.fact){
    const fact=document.createElement("blockquote");
    fact.className="fact";

    const paragraph=document.createElement("p");
    paragraph.innerHTML=`<span class="fact-label">💡 ${common.interesting_fact}:</span> ${section.fact}`;

    fact.appendChild(paragraph);
    fragment.appendChild(fact);
  }

  if(section.list){
    const list=document.createElement("ul");
    list.className="article-list";

    section.list.forEach(value=>{
      const item=document.createElement("li");
      item.innerHTML=value;
      list.appendChild(item);
    });

    fragment.appendChild(list);
  }

  if(section.after_list){
    const paragraph=document.createElement("p");
    paragraph.innerHTML=section.after_list;
    fragment.appendChild(paragraph);
  }

  return fragment;
}

async function init(){
  const language=getLanguage();

  let common;
  let article;

  try{
    common=await loadJson(`../lang/common/${language}.json`);
  }catch{
    common=await loadJson(`../lang/common/${DEFAULT_LANGUAGE}.json`);
  }

  try{
    article=await loadJson(`../lang/history/${language}.json`);
  }catch{
    article=await loadJson(`../lang/history/${DEFAULT_LANGUAGE}.json`);
  }

  applyCommon(common);

  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const key=element.dataset.i18n;

    if(key.startsWith("history.")){
      const value=getValue(article,key);

      if(value!==null){
        element.innerHTML=value;
      }
    }

    if(key.startsWith("telegram.")){
      const value=getValue(common,key);

      if(value!==null){
        element.innerHTML=value;
      }
    }
  });

  document.title=getValue(article,"history.title")||"Magic Rampage";

  const description=document.querySelector('meta[name="description"]');
  const descriptionValue=getValue(article,"history.description");

  if(description && descriptionValue){
    description.content=descriptionValue;
  }

  const coverAlt=getValue(article,"history.cover_alt");

  if(coverAlt){
    document.getElementById("coverImage").alt=coverAlt;
  }

  const body=document.getElementById("article-body");
  body.replaceChildren();

  article.history.sections.forEach(section=>{
    body.appendChild(renderSection(section,common));
  });

  document.documentElement.lang=language;
}

init();
</script>

</body>
  </html>
