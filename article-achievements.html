<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Все достижения Magic Rampage">
<title>Magic Rampage — Achievements</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0d0d;
  --card:#151515;
  --card2:#191919;
  --border:#292929;
  --text:#f2f2f2;
  --muted:#a6a6a6;
  --accent:#d6ad55;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  line-height:1.65;
}

a{
  color:inherit;
  text-decoration:none;
}

.page{
  width:min(900px,calc(100% - 28px));
  margin:0 auto;
  padding:20px 0 60px;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin:0 0 16px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.back:hover{
  color:var(--accent);
}

.back svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.article{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
}

.cover{
  display:block;
  width:100%;
  height:auto;
}

.article-content{
  padding:36px 40px 42px;
}

.article-label{
  margin-bottom:9px;
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}

h1{
  margin:0 0 32px;
  color:#fff;
  font-family:Cinzel,serif;
  font-size:clamp(29px,6vw,42px);
  line-height:1.18;
}

.section{
  margin-top:42px;
}

.section:first-of-type{
  margin-top:0;
}

.section-heading{
  display:flex;
  align-items:center;
  gap:13px;
  margin:0 0 17px;
  color:#fff;
  font-family:Cinzel,serif;
  font-size:clamp(21px,4vw,27px);
  line-height:1.25;
}

.section-heading::before{
  content:"";
  flex:0 0 8px;
  width:8px;
  height:8px;
  background:var(--accent);
  transform:rotate(45deg);
}

.achievement-list{
  display:grid;
  gap:10px;
}

.achievement{
  display:grid;
  grid-template-columns:44px minmax(0,1fr);
  gap:15px;
  padding:15px 17px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:13px;
  transition:border-color .2s,transform .2s,background .2s;
}

.achievement:hover{
  border-color:#3a3a3a;
  background:#1c1c1c;
  transform:translateY(-1px);
}

.achievement-number{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  margin-top:1px;
  border:1px solid rgba(214,173,85,.35);
  border-radius:10px;
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  line-height:1;
}

.achievement-title{
  margin:0 0 5px;
  color:#fff;
  font-size:15px;
  font-weight:700;
  line-height:1.4;
}

.achievement-description{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}

.telegram-section{
  border-top:1px solid var(--border);
  padding:30px 40px 34px;
}

.telegram-title{
  margin:0 0 17px;
  color:#fff;
  font-family:Cinzel,serif;
  font-size:21px;
}

.telegram-list{
  display:grid;
  gap:10px;
}

.telegram-link{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:62px;
  padding:9px 13px;
  background:#191919;
  border:1px solid var(--border);
  border-radius:13px;
  transition:.2s;
}

.telegram-link:hover{
  border-color:#3a3a3a;
  transform:translateY(-1px);
}

.telegram-avatar{
  width:43px;
  height:43px;
  flex:0 0 43px;
  border-radius:50%;
  object-fit:cover;
}

.telegram-info{
  min-width:0;
  flex:1;
}

.telegram-name{
  color:#fff;
  font-size:14px;
  font-weight:700;
  line-height:1.3;
}

.telegram-badge{
  display:inline-block;
  margin-top:3px;
  color:var(--accent);
  font-size:11px;
  font-weight:600;
}

.telegram-arrow{
  color:#777;
  font-size:22px;
  line-height:1;
}

.footer{
  padding-top:25px;
  text-align:center;
  color:#777;
  font-size:12px;
}

.footer a{
  color:var(--accent);
}

@media(max-width:620px){
  .page{
    width:min(100% - 20px,900px);
    padding-top:12px;
  }

  .article-content{
    padding:27px 17px 31px;
  }

  .telegram-section{
    padding:25px 17px 29px;
  }

  h1{
    margin-bottom:27px;
  }

  .section{
    margin-top:34px;
  }

  .achievement{
    grid-template-columns:38px minmax(0,1fr);
    gap:12px;
    padding:13px;
  }

  .achievement-number{
    width:34px;
    height:34px;
    border-radius:9px;
  }

  .achievement-title{
    font-size:14px;
  }

  .achievement-description{
    font-size:13px;
    line-height:1.6;
  }
}
</style>
</head>

<body>

<main class="page">

  <a class="back" href="index.html" data-i18n="back">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>
    <span></span>
  </a>

  <article class="article">

    <img class="cover" src="images/achievements.jpg" alt="">

    <div class="article-content">
      <div class="article-label" id="article-label"></div>
      <h1 id="article-title"></h1>
      <div id="achievement-sections"></div>
    </div>

    <section class="telegram-section">
      <h2 class="telegram-title" id="telegram-title"></h2>

      <div class="telegram-list">

        <a class="telegram-link" href="https://t.me/AssanteGames" target="_blank" rel="noopener">
          <img class="telegram-avatar" src="images/telegram/magic-rampage.jpg" alt="">
          <div class="telegram-info">
            <div class="telegram-name">Magic Rampage</div>
            <div class="telegram-badge" data-i18n="channel"></div>
          </div>
          <div class="telegram-arrow">›</div>
        </a>

        <a class="telegram-link" href="https://t.me/AssanteGamesChat" target="_blank" rel="noopener">
          <img class="telegram-avatar" src="images/telegram/magic-rampage-community.jpg" alt="">
          <div class="telegram-info">
            <div class="telegram-name">Magic Rampage<br>Community</div>
            <div class="telegram-badge" data-i18n="group"></div>
          </div>
          <div class="telegram-arrow">›</div>
        </a>

        <a class="telegram-link" href="https://t.me/MRCForum" target="_blank" rel="noopener">
          <img class="telegram-avatar" src="images/telegram/mrc-forum.jpg" alt="">
          <div class="telegram-info">
            <div class="telegram-name">MRC Forum</div>
            <div class="telegram-badge" data-i18n="forum"></div>
          </div>
          <div class="telegram-arrow">›</div>
        </a>

      </div>

      <div class="footer">
        Made by <a href="https://t.me/Koffecito" target="_blank" rel="noopener">Kofeman</a> (@Koffecito)
      </div>
    </section>

  </article>

</main>

<script>
const translations={
  ru:{
    back:"Назад",
    channel:"Канал",
    group:"Группа",
    forum:"Форум",
    telegram:"Наши сообщества в Telegram"
  },
  en:{
    back:"Back",
    channel:"Channel",
    group:"Group",
    forum:"Forum",
    telegram:"Our Telegram communities"
  }
};

function getLanguage(){
  return navigator.language && navigator.language.toLowerCase().startsWith("ru") ? "ru" : "en";
}

function applyCommon(language){
  document.documentElement.lang=language;

  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const key=element.dataset.i18n;
    if(translations[language][key]){
      element.textContent=translations[language][key];
    }
  });

  document.getElementById("telegram-title").textContent=translations[language].telegram;
}

function createAchievement(item){
  const card=document.createElement("article");
  card.className="achievement";

  const number=document.createElement("div");
  number.className="achievement-number";
  number.textContent=item.number;

  const content=document.createElement("div");

  const title=document.createElement("h3");
  title.className="achievement-title";
  title.textContent=item.title;

  const description=document.createElement("p");
  description.className="achievement-description";
  description.textContent=item.description;

  content.appendChild(title);
  content.appendChild(description);

  card.appendChild(number);
  card.appendChild(content);

  return card;
}

function renderSections(data){
  document.getElementById("article-label").textContent=data.label;
  document.getElementById("article-title").textContent=data.title;

  const container=document.getElementById("achievement-sections");
  container.innerHTML="";

  data.sections.forEach(section=>{
    const wrapper=document.createElement("section");
    wrapper.className="section";

    const heading=document.createElement("h2");
    heading.className="section-heading";
    heading.textContent=section.title;

    const list=document.createElement("div");
    list.className="achievement-list";

    section.items.forEach(item=>{
      list.appendChild(createAchievement(item));
    });

    wrapper.appendChild(heading);
    wrapper.appendChild(list);
    container.appendChild(wrapper);
  });
}

async function loadData(language){
  try{
    const response=await fetch(`lang/achievements/${language}.json`);
    if(!response.ok){
      throw new Error("Language file not found");
    }
    return await response.json();
  }catch(error){
    if(language!=="en"){
      const response=await fetch("lang/achievements/en.json");
      return await response.json();
    }
    throw error;
  }
}

async function init(){
  const language=getLanguage();
  applyCommon(language);

  try{
    const data=await loadData(language);
    renderSections(data);
  }catch(error){
    document.getElementById("article-title").textContent="All Magic Rampage Achievements";
  }
}

init();
</script>

</body>
  </html>
