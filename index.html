<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Magic Rampage</title>
  <meta name="description" content="Информационный портал о Magic Rampage.">
  <meta name="theme-color" content="#0d0f14">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d0f14;
      --card: #151822;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(216,162,74,0.35);
      --text: #f0f1f4;
      --text-dim: #9da2af;
      --accent: #d8a24a;
      --font-body: 'Inter', sans-serif;
      --font-display: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          900px 600px at 50% -150px,
          #202431 0%,
          var(--bg) 65%
        );
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 65px 18px 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero-kicker {
      margin: 0 0 12px;
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(32px, 8vw, 48px);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .hero-line {
      width: 45px;
      height: 1px;
      margin: 19px auto;
      background: var(--accent);
      opacity: 0.7;
    }

    .hero-description {
      max-width: 600px;
      margin: 0 auto;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.75;
    }

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .article-card {
      position: relative;
      display: block;
      color: var(--text);
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .article-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow:
        0 12px 35px rgba(0,0,0,0.22);
    }

    .article-card:active {
      transform: translateY(-1px);
    }

    .article-image {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #101219;
    }

    .article-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition:
        transform 0.45s ease,
        filter 0.3s ease;
    }

    .article-card:hover .article-image img {
      transform: scale(1.035);
      filter: brightness(1.06);
    }

    .article-image::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 45%;
      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(0,0,0,0.3)
        );
      pointer-events: none;
    }

    .article-content {
      position: relative;
      padding: 22px 25px 25px;
    }

    .article-number {
      display: block;
      margin-bottom: 9px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .article-title {
      margin: 0;
      padding-right: 35px;
      font-family: var(--font-display);
      font-size: 20px;
      line-height: 1.35;
      font-weight: 600;
    }

    .article-description {
      margin: 11px 35px 0 0;
      color: var(--text-dim);
      font-size: 13.5px;
      line-height: 1.7;
    }

    .article-arrow {
      position: absolute;
      right: 25px;
      top: 26px;
      width: 9px;
      height: 9px;
      border-top: 1px solid var(--accent);
      border-right: 1px solid var(--accent);
      transform: rotate(45deg);
      opacity: 0.65;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .article-card:hover .article-arrow {
      transform:
        translateX(4px)
        rotate(45deg);
      opacity: 1;
    }

    .links-card {
      margin-top: 5px;
    }

    .footer {
      margin-top: 38px;
      text-align: center;
      color: #626773;
      font-size: 11px;
    }

    .footer-author {
      color: var(--accent);
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .footer-author:hover {
      opacity: 0.8;
    }

    @media (max-width: 520px) {
      .page {
        padding:
          45px
          13px
          45px;
      }

      .hero {
        margin-bottom: 30px;
      }

      .hero-description {
        font-size: 13px;
      }

      .article-list {
        gap: 15px;
      }

      .article-card {
        border-radius: 17px;
      }

      .article-image {
        aspect-ratio: 16 / 9;
      }

      .article-content {
        padding:
          18px
          18px
          20px;
      }

      .article-title {
        font-size: 17px;
        padding-right: 30px;
      }

      .article-description {
        margin-top: 9px;
        margin-right: 28px;
        font-size: 13px;
        line-height: 1.65;
      }

      .article-arrow {
        right: 19px;
        top: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <p class="hero-kicker" id="hero-kicker"></p>

      <h1 class="hero-title">
        Magic Rampage
      </h1>

      <div class="hero-line"></div>

      <p class="hero-description" id="hero-description"></p>
    </header>

    <section class="article-list" id="article-list"></section>

    <footer class="footer">
      <span id="made-by"></span>
      <span class="footer-author">Kofeman</span>
      <span id="author-handle"></span>
    </footer>
  </main>

  <script>
    const language = navigator.language.toLowerCase().startsWith("ru") ? "ru" : "en";

    const articles = [
      {
        number: "01",
        href: "history.html",
        image: "images/history.jpg",
        key: "history"
      },
      {
        number: "02",
        href: "support.html",
        image: "images/support.jpg",
        key: "support"
      },
      {
        number: "03",
        href: "ban.html",
        image: "images/ban.jpg",
        key: "ban"
      },
      {
        number: "04",
        href: "achievements.html",
        image: "images/achievements.jpg",
        key: "achievements"
      },
      {
        number: "05",
        href: "apps.html",
        image: "images/apps.jpg",
        key: "apps"
      },
      {
        number: "06",
        href: "links.html",
        image: "images/links.jpg",
        key: "links",
        extraClass: "links-card"
      }
    ];

    async function loadLanguage() {
      const response = await fetch(`lang/${language}.json`);
      const data = await response.json();

      document.documentElement.lang = language;
      document.title = data.meta.title;
      document.querySelector('meta[name="description"]').setAttribute("content", data.meta.description);

      document.getElementById("hero-kicker").textContent = data.hero.kicker;
      document.getElementById("hero-description").textContent = data.hero.description;
      document.getElementById("made-by").textContent = `${data.footer.madeBy} `;
      document.getElementById("author-handle").textContent = ` ${data.footer.handle}`;

      const list = document.getElementById("article-list");

      articles.forEach(article => {
        const text = data.articles[article.key];

        const card = document.createElement("a");
        card.className = `article-card${article.extraClass ? ` ${article.extraClass}` : ""}`;
        card.href = article.href;

        const image = document.createElement("div");
        image.className = "article-image";

        const img = document.createElement("img");
        img.src = article.image;
        img.alt = text.alt;

        image.appendChild(img);

        const content = document.createElement("div");
        content.className = "article-content";

        const number = document.createElement("span");
        number.className = "article-number";
        number.textContent = article.number;

        const title = document.createElement("h2");
        title.className = "article-title";
        title.textContent = text.title;

        const description = document.createElement("p");
        description.className = "article-description";
        description.textContent = text.description;

        const arrow = document.createElement("span");
        arrow.className = "article-arrow";

        content.appendChild(number);
        content.appendChild(title);
        content.appendChild(description);
        content.appendChild(arrow);

        card.appendChild(image);
        card.appendChild(content);
        list.appendChild(card);
      });
    }

    loadLanguage();
  </script>
</body>
</html>
